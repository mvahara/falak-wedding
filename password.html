<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Invitation</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-family: Arial, sans-serif;
            background: #fff8f5;
        }

        .password-box {
            width: 90%;
            max-width: 400px;
            padding: 35px 25px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
        }

        h1 {
            margin-bottom: 10px;
        }

        input {
            width: 90%;
            padding: 14px;
            margin: 15px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            padding: 13px 28px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        #error {
            color: red;
            min-height: 20px;
        }
    </style>
</head>

<body>

    <div class="password-box">
        <h1>💍 Wedding Invitation</h1>
        <p>Enter the password to open the invitation</p>

        <input type="password" id="password" placeholder="Enter password">

        <br>

        <button onclick="openInvitation()">Open Invitation</button>

        <p id="error"></p>
    </div>

    <script>
        function openInvitation() {
            const password = document.getElementById("password").value;

            if (password === "Mohammad") {
                window.location.href = "index.html";
            } else {
                document.getElementById("error").textContent =
                    "Incorrect password. Please try again.";
            }
        }
    </script>

</body>
</html>
